<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0e">
  <title>BATS — Fare Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0e;
      color: #f7f7f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #a6a6ad;
      --panel: #1e1e20;
      --line: #363639;
      --accent: #00FFD5;
      --frame: #00FFD5;
      --green: #63d59a;
      --motion-ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(ellipse at 50% -25%, #19191b 0, #0d0d0e 54%); }
    .launch-page { display: grid; min-height: 100vh; place-items: center; padding: 24px; }
    .launch-card { width: min(100%, 540px); padding: 34px; border: 1px solid var(--frame); border-radius: 22px; background: linear-gradient(145deg, #11191a 0%, #111112 48%, #101819 100%); box-shadow: 0 0 0 1px #00ffd533, 0 16px 48px #00ffd51a; text-align: center; animation: dissolve-in .7s var(--motion-ease) both; }
    .launch-card h1 { margin: 0 0 10px; font-size: clamp(24px, 5vw, 34px); }
    .launch-copy { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .launch-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
    .launch-button { min-height: 52px; border: 1px solid #00ffd56b; border-radius: 12px; color: #071615; background: var(--accent); font: inherit; font-weight: 750; cursor: pointer; box-shadow: 0 5px 18px #00ffd51f; transition: transform .22s var(--motion-ease), box-shadow .25s var(--motion-ease), background-color .22s var(--motion-ease); }
    .launch-button:hover { transform: translateY(-2px); background: #35ffe0; box-shadow: 0 9px 24px #00ffd540; }
    .launch-button:active { transform: translateY(0) scale(.98); }
    .launch-button:focus-visible, .modal-close:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .calculator-overlay { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; overflow-y: auto; padding: 24px; background: #050909c9; backdrop-filter: blur(0); opacity: 0; transition: opacity .38s var(--motion-ease), backdrop-filter .38s var(--motion-ease); }
    .calculator-overlay[hidden] { display: none; }
    .calculator-overlay.is-open { opacity: 1; backdrop-filter: blur(7px); }
    .calculator-overlay.is-closing { opacity: 0; backdrop-filter: blur(0); }
    .app { position: relative; width: min(100%, 780px); margin: auto; padding: 23px 24px 18px; border: 1px solid var(--frame); border-radius: 22px; background: linear-gradient(145deg, #11191a 0%, #111112 48%, #101819 100%); box-shadow: 0 0 0 1px #00ffd533, 0 16px 48px #00ffd51a; opacity: 0; transform: translateY(18px) scale(.985); transition: opacity .38s var(--motion-ease), transform .38s var(--motion-ease); }
    .calculator-overlay.is-open .app { opacity: 1; transform: translateY(0) scale(1); }
    .calculator-overlay.is-closing .app { opacity: 0; transform: translateY(10px) scale(.99); }
    .calculator-overlay.is-open .app > * { animation: dissolve-item .42s var(--motion-ease) both; }
    .calculator-overlay.is-open .app > :nth-child(1) { animation-delay: .02s; }
    .calculator-overlay.is-open .app > :nth-child(2) { animation-delay: .06s; }
    .calculator-overlay.is-open .app > :nth-child(3) { animation-delay: .1s; }
    .calculator-overlay.is-open .app > :nth-child(4) { animation-delay: .14s; }
    .calculator-overlay.is-open .app > :nth-child(5) { animation-delay: .2s; }
    .calculator-overlay.is-open .app > :nth-child(6) { animation-delay: .24s; }
    .calculator-overlay.is-open .form-grid .field { animation: dissolve-item .38s var(--motion-ease) both; }
    .calculator-overlay.is-open .form-grid .field:nth-child(1) { animation-delay: .12s; }
    .calculator-overlay.is-open .form-grid .field:nth-child(2) { animation-delay: .16s; }
    .calculator-overlay.is-open .form-grid .field:nth-child(3) { animation-delay: .2s; }
    .calculator-overlay.is-open .form-grid .field:nth-child(4) { animation-delay: .24s; }
    .calculator-overlay.is-open .form-grid .field:nth-child(5) { animation-delay: .28s; }
    .calculator-overlay.is-open .form-grid .field:nth-child(6) { animation-delay: .32s; }
    .modal-close { position: absolute; top: 14px; right: 15px; display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid #39393d; border-radius: 50%; color: #f5f5f6; background: #1b1b1e; font-size: 22px; line-height: 1; cursor: pointer; transition: color .22s var(--motion-ease), border-color .22s var(--motion-ease), transform .22s var(--motion-ease); }
    .modal-close:hover { color: var(--accent); border-color: var(--accent); transform: rotate(90deg); }
    .ride-toggle { display: grid; grid-template-columns: 1fr 1fr; width: min(100%, 430px); margin: 0 auto 29px; padding: 5px; border: 1px solid #27272a; border-radius: 14px; background: #171719; }
    .ride-toggle button { min-height: 46px; border: 0; border-radius: 10px; color: #e8e8eb; background: transparent; font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; transition: color .22s var(--motion-ease), background-color .22s var(--motion-ease), box-shadow .25s var(--motion-ease), transform .22s var(--motion-ease); }
    .ride-toggle button:hover { color: #fff; background: #ffffff0a; }
    .ride-toggle button[aria-pressed="true"] { color: #071615; background: var(--accent); box-shadow: 0 5px 18px #00ffd538; }
    .ride-toggle button[aria-pressed="true"]:hover { background: #35ffe0; box-shadow: 0 7px 23px #00ffd54d; }
    .ride-toggle button:active { transform: scale(.975); }
    .ride-toggle button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .19em; }
    h1 { margin: 0; font-size: clamp(21px, 3vw, 27px); line-height: 1.2; font-weight: 750; letter-spacing: -.035em; }
    .status { display: inline-flex; align-items: center; gap: 9px; padding: 9px 13px; border: 1px solid #2d2d30; border-radius: 999px; color: #dedee1; font-size: 12px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px #63d59a70; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 19px 18px; }
    .field { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
    .field[hidden] { display: none; }
    .form-grid:focus-within, .form-grid.is-dropdown-open { position: relative; z-index: 8; }
    .field:focus-within, .field.is-dropdown-open { position: relative; z-index: 9; }
    label { color: #ededf0; font-size: 13px; font-weight: 650; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: ""; position: absolute; z-index: 3; width: 7px; height: 7px; top: 50%; right: 17px; border-right: 1.5px solid #a4a4a9; border-bottom: 1.5px solid #a4a4a9; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
    select { width: 100%; height: 52px; appearance: none; border: 1px solid #38383b; border-radius: 12px; padding: 0 42px 0 15px; outline: none; color: #f5f5f6; background: var(--panel); font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; transition: border-color .22s var(--motion-ease), box-shadow .22s var(--motion-ease), background .22s var(--motion-ease); }
    select:hover { background: #242426; }
    select:focus-visible { border-color: #77777e; box-shadow: 0 0 0 3px #ffffff12; }
    select:disabled { opacity: .55; cursor: not-allowed; }
    select option { color: #f5f5f6; background: #1e1e20; }
    .select-wrap select.native-select { position: absolute; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; pointer-events: none; }
    .custom-select-button { position: relative; z-index: 1; display: flex; width: 100%; height: 52px; align-items: center; overflow: hidden; border: 1px solid #38383b; border-radius: 12px; padding: 0 42px 0 15px; color: #f5f5f6; background: var(--panel); font: inherit; font-size: 14px; font-weight: 650; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; transition: border-color .22s var(--motion-ease), box-shadow .22s var(--motion-ease), background .22s var(--motion-ease); }
    .custom-select-button:hover, .custom-select-button[aria-expanded="true"] { background: #242426; }
    .custom-select-button:focus-visible { border-color: #77777e; box-shadow: 0 0 0 3px #ffffff12; outline: none; }
    .custom-select-button:disabled { opacity: .55; cursor: not-allowed; }
    .custom-select-menu { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; right: 0; max-height: min(360px, calc(100vh - 150px)); overflow-y: hidden; padding: 5px; border: 1px solid #414145; border-radius: 11px; background: #1e1e20; box-shadow: 0 12px 30px #0009; transform-origin: top center; }
    .custom-select-menu[hidden] { display: none; }
    .custom-select-menu.is-open { animation: dropdown-dissolve .2s var(--motion-ease) both; }
    .custom-select-menu.is-closing { animation: dropdown-dissolve-out .14s ease-in both; }
    .custom-select-option { min-height: 20px; display: flex; align-items: center; border-radius: 7px; padding: 2px 8px; color: #f5f5f6; font-size: 12px; line-height: 1.15; cursor: pointer; animation: dissolve-item .25s var(--motion-ease) both; animation-delay: var(--option-delay, 0ms); }
    .custom-select-option:hover, .custom-select-option.is-active { color: #071615; background: var(--accent); }
    .custom-select-option[aria-selected="true"] { font-weight: 750; }
    .custom-select-option[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 23px; min-height: 76px; padding: 15px 18px; border: 1px solid #3a3a3d; border-radius: 13px; background: #1a1a1c; }
    .summary-item { display: flex; align-items: center; gap: 7px; font-size: clamp(14px, 2vw, 16px); font-weight: 750; white-space: nowrap; }
    .summary-copy { display: flex; flex-direction: column; gap: 5px; }
    .summary-copy small { color: var(--muted); font-size: 11px; font-weight: 450; white-space: normal; }
    .summary-divider { width: 1px; height: 22px; background: #777; }
    .total { font-size: inherit; font-weight: 800; letter-spacing: -.02em; }
    .change { color: var(--green); }
    .change.warning { color: #ffb164; }

    .footer { display: flex; justify-content: center; align-items: center; gap: 13px; margin-top: 27px; color: #a4a4aa; font-size: 11px; }
    .footer::before, .footer::after { content: ""; width: 34px; height: 1px; background: #303033; }
    .footer strong { color: #f1f1f2; font-weight: 750; letter-spacing: .04em; }

    @keyframes dissolve-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes dissolve-item {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
      @keyframes dropdown-dissolve {
        from { opacity: 0; transform: translateY(-6px) scale(.99); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes dropdown-dissolve-out {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to { opacity: 0; transform: translateY(-4px) scale(.99); }
      }

    @media (max-width: 600px) {
      .launch-card { padding: 28px 20px; }
      .launch-actions { grid-template-columns: 1fr; }
      .calculator-overlay { align-items: start; padding: 14px; }
      .app { width: 100%; margin: auto; padding: 56px 16px 18px; }
      .ride-toggle { margin-bottom: 25px; }
      .topline { margin-bottom: 23px; }
      .form-grid { grid-template-columns: 1fr; gap: 17px; }
      select { height: 50px; }
      .custom-select-button { height: 50px; }
      .summary { margin-top: 23px; gap: 12px; min-height: 52px; padding: 12px 10px; }
      .summary-item { gap: 5px; font-size: clamp(12px, 3.5vw, 16px); }
      .status { padding: 8px 10px; font-size: 10px; }
    }
    @media (max-height: 500px) { .custom-select-menu { overflow-y: auto; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="launch-page">
    <section class="launch-card" aria-labelledby="launchTitle">
      <p class="eyebrow">DIESEL N STEEL · FARE CALCULATOR</p>
      <h1 id="launchTitle">Plan your ride</h1>
      <p class="launch-copy">Choose your ride type to check the Bulakan fare routes.</p>
      <div class="launch-actions">
        <button class="launch-button" type="button" data-open-mode="single">Open Single Ride</button>
        <button class="launch-button" type="button" data-open-mode="pickup">Open Pickup Ride</button>
      </div>
    </section>
  </main>
  <div class="calculator-overlay" id="calculatorOverlay" hidden>
  <main class="app" role="dialog" aria-modal="true" aria-labelledby="rideTitle" tabindex="-1">
    <button class="modal-close" type="button" id="closeCalculator" aria-label="Close fare calculator">×</button>
    <nav class="ride-toggle" aria-label="Ride type">
      <button type="button" id="singleMode" aria-pressed="false">Single</button>
      <button type="button" id="pickupMode" aria-pressed="true">Pickup</button>
    </nav>
    <header class="topline">
      <div>
        <p class="eyebrow">YOUR TRIP</p>
        <h1 id="rideTitle">Pickup ride</h1>
      </div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span>Fare guide active</div>
    </header>

    <section class="form-grid" aria-label="Trip details">
      <div class="field">
        <label for="route">Route</label>
        <div class="select-wrap"><select id="route">
          <option value="outbound">Bulakan → Malolos</option>
          <option value="inbound">Malolos → Bulakan</option>
          <option value="bulakanToBalagtas">Bulakan → Balagtas</option>
          <option value="balagtasToBulakan">Balagtas → Bulakan</option>
        </select></div>
      </div>
      <div class="field" id="pickupField">
        <label for="pickup">Pickup</label>
        <div class="select-wrap"><select id="pickup"><option value="">Pickup</option></select></div>
      </div>
      <div class="field">
        <label for="destination">Drop-off</label>
        <div class="select-wrap"><select id="destination"></select></div>
      </div>
      <div class="field">
        <label for="fareType">Fare type</label>
        <div class="select-wrap"><select id="fareType">
          <option value="regular">Regular</option>
          <option value="discounted">Senior / Student</option>
        </select></div>
      </div>
      <div class="field">
        <label for="passengers">Passengers</label>
        <div class="select-wrap"><select id="passengers">
          <option value="">Select</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option>
        </select></div>
      </div>
      <div class="field">
        <label for="cash">Cash tendered</label>
        <div class="select-wrap"><select id="cash">
          <option value="">Select</option>
          <option value="20">₱20</option><option value="50">₱50</option><option value="100">₱100</option>
        </select></div>
      </div>
    </section>

    <section class="summary" aria-live="polite" aria-atomic="true">
      <div class="summary-copy"><div class="summary-item">Estimated total</div><small id="fareHint">Choose a pickup and drop-off to calculate your fare.</small></div>
      <div class="summary-item total">₱<span id="total">0</span></div>
      <span class="summary-divider" aria-hidden="true" id="summaryDivider" hidden></span>
      <div class="summary-item change" id="change" hidden></div>
    </section>

    <footer class="footer"><span>Built by <strong>BATS</strong></span></footer>
  </main>
  </div>
  <script>
    const fares = {
      outbound: [
        ["BAGUMBAYAN (SAN JOSE)", 14, 12], ["MAYSANTOL", 14, 12], ["SAN NICOLAS", 14, 12], ["PITPITAN", 14, 12],
        ["MAMBOG", 16, 14], ["MATIMBO", 18, 16], ["PANASAHAN", 20, 18], ["BAGNA", 22, 20], ["ATLAG", 24, 22], ["SAN JUAN (STO. ROSARIO)", 26, 24]
      ],
      inbound: [
        ["SAN JUAN (STO. ROSARIO)", 14, 12], ["ATLAG", 14, 12], ["BAGNA", 14, 12], ["PANASAHAN", 14, 12],
        ["MATIMBO", 16, 14], ["MAMBOG", 18, 16], ["PITPITAN", 20, 18], ["SAN NICOLAS", 22, 20], ["MAYSANTOL", 24, 22], ["BAGUMBAYAN (SAN JOSE)", 26, 24]
      ],
      bulakanToBalagtas: [
        ["SN JOSE", 14, 11], ["MATUNGAO", 14, 11], ["PANGINAY", 14, 11], ["WAWA", 16, 14]
      ],
      balagtasToBulakan: [
        ["WAWA", 14, 11], ["PANGINAY", 14, 11], ["MATUNGAO", 14, 11], ["BAGUMBAYAN / SN. JOSE", 16, 14]
      ]
    };
    const pickupFareBands = {
      regular: [14, 16, 18, 20, 22, 24, 26],
      discounted: [12, 14, 16, 18, 20, 22, 24]
    };
    const route = document.querySelector("#route");
    const pickup = document.querySelector("#pickup");
    const destination = document.querySelector("#destination");
    const fareType = document.querySelector("#fareType");
    const passengers = document.querySelector("#passengers");
    const cash = document.querySelector("#cash");
    const total = document.querySelector("#total");
    const change = document.querySelector("#change");
    const summaryDivider = document.querySelector("#summaryDivider");
    const singleMode = document.querySelector("#singleMode");
    const pickupMode = document.querySelector("#pickupMode");
    const pickupField = document.querySelector("#pickupField");
    const rideTitle = document.querySelector("#rideTitle");
    const fareHint = document.querySelector("#fareHint");
    const calculatorOverlay = document.querySelector("#calculatorOverlay");
    const closeCalculator = document.querySelector("#closeCalculator");
    const calculatorDialog = document.querySelector('[role="dialog"]');
    let lastTrigger = null;
    let closeTimer = 0;
    const enhancedSelects = new Map();
    const money = value => new Intl.NumberFormat("en-PH").format(value);

    function syncCustomSelect(select, custom = enhancedSelects.get(select)) {
      if (!custom) return;
      const options = [...select.options];
      custom.button.textContent = options[select.selectedIndex]?.textContent ?? "Select";
      custom.button.disabled = select.disabled;
      custom.menu.replaceChildren(...options.map((option, index) => {
        const item = document.createElement("div");
        item.id = `${select.id}-option-${index}`;
        item.className = "custom-select-option";
        item.setAttribute("role", "option");
        item.setAttribute("aria-selected", String(index === select.selectedIndex));
        item.setAttribute("aria-disabled", String(option.disabled));
        item.style.setProperty("--option-delay", `${index * 16}ms`);
        item.textContent = option.textContent;
        item.addEventListener("pointerdown", event => event.preventDefault());
        item.addEventListener("click", () => {
          if (option.disabled) return;
          select.selectedIndex = index;
          select.dispatchEvent(new Event("change", { bubbles: true }));
          closeCustomSelect(custom);
          custom.button.focus();
        });
        return item;
      }));
      custom.activeIndex = Math.max(0, select.selectedIndex);
      updateActiveCustomOption(custom);
    }

    function updateActiveCustomOption(custom) {
      const items = [...custom.menu.children];
      items.forEach((item, index) => item.classList.toggle("is-active", index === custom.activeIndex));
      const activeItem = items[custom.activeIndex];
      if (activeItem) {
        custom.button.setAttribute("aria-activedescendant", activeItem.id);
        activeItem.scrollIntoView({ block: "nearest" });
      } else {
        custom.button.removeAttribute("aria-activedescendant");
      }
    }

    function closeCustomSelect(custom, animate = true) {
      if (custom.menu.hidden) return;
      custom.button.setAttribute("aria-expanded", "false");
      custom.button.removeAttribute("aria-activedescendant");
      custom.menu.classList.remove("is-open");
      if (!animate) {
        custom.menu.hidden = true;
        custom.menu.classList.remove("is-closing");
        custom.wrapper.classList.remove("is-dropdown-open");
        custom.field.classList.remove("is-dropdown-open");
        custom.wrapper.closest(".form-grid")?.classList.remove("is-dropdown-open");
        return;
      }
      custom.menu.classList.add("is-closing");
      window.setTimeout(() => {
        if (custom.menu.classList.contains("is-closing")) {
          custom.menu.hidden = true;
          custom.menu.classList.remove("is-closing");
          custom.wrapper.classList.remove("is-dropdown-open");
          custom.field.classList.remove("is-dropdown-open");
          custom.wrapper.closest(".form-grid")?.classList.remove("is-dropdown-open");
        }
      }, 150);
    }

    function openCustomSelect(custom) {
      for (const other of enhancedSelects.values()) {
        if (other !== custom) closeCustomSelect(other, false);
      }
      syncCustomSelect(custom);
      custom.menu.hidden = false;
      custom.menu.classList.remove("is-closing");
      void custom.menu.offsetWidth;
      custom.menu.classList.add("is-open");
      custom.wrapper.classList.add("is-dropdown-open");
      custom.field.classList.add("is-dropdown-open");
      custom.wrapper.closest(".form-grid")?.classList.add("is-dropdown-open");
      custom.button.setAttribute("aria-expanded", "true");
      updateActiveCustomOption(custom);
    }

    function enhanceSelect(select) {
      const wrapper = select.closest(".select-wrap");
      if (!wrapper) return;
      const label = select.labels?.[0]?.textContent.trim() || "Choose an option";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "custom-select-button";
      button.setAttribute("role", "combobox");
      button.setAttribute("aria-label", label);
      button.setAttribute("aria-haspopup", "listbox");
      button.setAttribute("aria-expanded", "false");
      button.setAttribute("aria-controls", `${select.id}-listbox`);

      const menu = document.createElement("div");
      menu.id = `${select.id}-listbox`;
      menu.className = "custom-select-menu";
      menu.setAttribute("role", "listbox");
      menu.setAttribute("aria-label", label);
      menu.hidden = true;

      const custom = { select, wrapper, field: select.closest(".field"), button, menu, activeIndex: 0 };
      enhancedSelects.set(select, custom);
      select.classList.add("native-select");
      select.tabIndex = -1;
      select.setAttribute("aria-hidden", "true");
      wrapper.append(button, menu);

      button.addEventListener("click", () => {
        if (menu.hidden) openCustomSelect(custom);
        else closeCustomSelect(custom);
      });
      button.addEventListener("keydown", event => {
        const lastIndex = select.options.length - 1;
        if (["ArrowDown", "ArrowUp", "Home", "End", "Enter", " "].includes(event.key)) event.preventDefault();
        if (event.key === "Escape" && !menu.hidden) {
          closeCustomSelect(custom);
          return;
        }
        if (event.key === "Tab" && !menu.hidden) closeCustomSelect(custom, false);
        if (menu.hidden) {
          if (["ArrowDown", "ArrowUp", "Enter", " "].includes(event.key)) openCustomSelect(custom);
          return;
        }
        if (event.key === "ArrowDown") custom.activeIndex = Math.min(lastIndex, custom.activeIndex + 1);
        else if (event.key === "ArrowUp") custom.activeIndex = Math.max(0, custom.activeIndex - 1);
        else if (event.key === "Home") custom.activeIndex = 0;
        else if (event.key === "End") custom.activeIndex = lastIndex;
        else if (event.key === "Enter" || event.key === " ") {
          const option = select.options[custom.activeIndex];
          if (option && !option.disabled) {
            select.selectedIndex = custom.activeIndex;
            select.dispatchEvent(new Event("change", { bubbles: true }));
            closeCustomSelect(custom);
          }
          return;
        }
        if (event.key.startsWith("Arrow") || event.key === "Home" || event.key === "End") updateActiveCustomOption(custom);
      });
      select.addEventListener("change", () => syncCustomSelect(select));
      new MutationObserver(() => syncCustomSelect(select)).observe(select, { childList: true, subtree: true });
      syncCustomSelect(select);
    }

    function enhanceAllSelects() {
      document.querySelectorAll(".select-wrap select").forEach(select => {
        if (!enhancedSelects.has(select)) enhanceSelect(select);
        else syncCustomSelect(select);
      });
    }
    let rideType = "pickup";

    function renderPickups() {
      const stops = fares[route.value];
      const selected = pickup.value;
      const startStop = route.value === "inbound"
        ? "MALOLOS TERMINAL"
        : route.value === "balagtasToBulakan"
          ? "BALAGTAS TERMINAL"
          : "BULAKAN TERMINAL";
      pickup.replaceChildren(new Option("Pickup", ""), new Option(startStop, "start"));
      for (const [name] of stops.slice(0, -1)) pickup.add(new Option(name, name));
      if ([...pickup.options].some(option => option.value === selected)) pickup.value = selected;
      renderDestinations();
    }

    function renderDestinations() {
      const selected = destination.value;
      const stops = fares[route.value];
      const pickupIndex = rideType === "pickup" && pickup.value && pickup.value !== "start"
        ? stops.findIndex(([name]) => name === pickup.value)
        : -1;
      const availableStops = rideType === "pickup" && !pickup.value ? [] : stops.slice(pickupIndex + 1);
      destination.replaceChildren(...availableStops.map(([name]) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        return option;
      }));
      if (availableStops.some(([name]) => name === selected)) destination.value = selected;
      else if (destination.options.length) destination.selectedIndex = 0;
      updateTotal();
    }

    function setRideType(type) {
      rideType = type;
      const isPickup = type === "pickup";
      pickupField.hidden = !isPickup;
      pickupMode.setAttribute("aria-pressed", String(isPickup));
      singleMode.setAttribute("aria-pressed", String(!isPickup));
      rideTitle.textContent = isPickup ? "Pickup ride" : "Single ride";
      fareHint.textContent = isPickup
        ? "Choose a pickup and drop-off to calculate your fare."
        : "Choose passengers to calculate your fare.";
      renderDestinations();
    }

    function openCalculator(type, trigger) {
      lastTrigger = trigger;
      calculatorOverlay.hidden = false;
      document.body.style.overflow = "hidden";
      setRideType(type);
      void calculatorOverlay.offsetWidth;
      calculatorOverlay.classList.add("is-open");
      calculatorDialog.focus();
    }

    function closeCalculatorOverlay() {
      if (calculatorOverlay.hidden || calculatorOverlay.classList.contains("is-closing")) return;
      calculatorOverlay.classList.remove("is-open");
      calculatorOverlay.classList.add("is-closing");
      const finishClose = () => {
        if (calculatorOverlay.hidden) return;
        calculatorOverlay.hidden = true;
        calculatorOverlay.classList.remove("is-closing");
        document.body.style.overflow = "";
        window.clearTimeout(closeTimer);
        lastTrigger?.focus();
      };
      calculatorOverlay.addEventListener("transitionend", event => {
        if (event.target === calculatorOverlay && event.propertyName === "opacity") finishClose();
      }, { once: true });
      closeTimer = window.setTimeout(finishClose, 420);
    }

    function updateTotal() {
      const selectedDestination = fares[route.value].find(([name]) => name === destination.value);
      const count = Number(passengers.value);
      const fareColumn = fareType.value === "discounted" ? 2 : 1;
      let unitFare = selectedDestination ? selectedDestination[fareColumn] : 0;
      if (rideType === "pickup" && selectedDestination && pickup.value && pickup.value !== "start") {
        const stops = fares[route.value];
        const pickupIndex = stops.findIndex(([name]) => name === pickup.value);
        const dropoffIndex = stops.findIndex(([name]) => name === destination.value);
        const distance = dropoffIndex - pickupIndex;
        const fareBands = pickupFareBands[fareType.value];
        const fareBand = Math.min(Math.max(0, distance - 3), fareBands.length - 1);
        unitFare = fareBands[fareBand];
      }
      const amount = unitFare * count;
      total.textContent = money(amount);
      if (rideType === "pickup" && (!pickup.value || !selectedDestination)) {
        fareHint.textContent = "Choose a pickup and drop-off to calculate your fare.";
      } else if (!count) {
        fareHint.textContent = "Choose passengers to calculate your fare.";
      } else {
        fareHint.textContent = `${count} passenger${count === 1 ? "" : "s"} · ₱${money(unitFare)} each`;
      }
      change.hidden = true;
      summaryDivider.hidden = true;
      change.classList.remove("warning");

      if (!count || !cash.value || !selectedDestination || (rideType === "pickup" && !pickup.value)) return;
      if (Number(cash.value) >= amount) {
        change.textContent = `Change ₱${money(Number(cash.value) - amount)}`;
      } else {
        change.textContent = `₱${money(amount - Number(cash.value))} short`;
        change.classList.add("warning");
      }
      change.hidden = false;
      summaryDivider.hidden = false;
    }

    route.addEventListener("change", renderPickups);
    pickup.addEventListener("change", renderDestinations);
    destination.addEventListener("change", updateTotal);
    for (const control of [fareType, passengers, cash]) control.addEventListener("change", updateTotal);
    singleMode.addEventListener("click", () => setRideType("single"));
    pickupMode.addEventListener("click", () => setRideType("pickup"));
    document.querySelectorAll("[data-open-mode]").forEach(button => {
      button.addEventListener("click", () => openCalculator(button.dataset.openMode, button));
    });
    closeCalculator.addEventListener("click", closeCalculatorOverlay);
    calculatorOverlay.addEventListener("click", event => {
      if (event.target === calculatorOverlay) closeCalculatorOverlay();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        const openSelect = [...enhancedSelects.values()].find(custom => !custom.menu.hidden);
        if (openSelect) {
          closeCustomSelect(openSelect);
          openSelect.button.focus();
        } else {
          closeCalculatorOverlay();
        }
      }
    });
    document.addEventListener("pointerdown", event => {
      if (event.target.closest(".select-wrap")) return;
      for (const custom of enhancedSelects.values()) closeCustomSelect(custom);
    });
    renderPickups();
    enhanceAllSelects();
  </script>
</body>
</html>
